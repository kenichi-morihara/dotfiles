name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh ruby
      - name: Run tests
        # Use the same checksum-pinned chezmoi on both CI operating systems.
        run: |
          chezmoi_bin="$(bash tests/bootstrap-chezmoi.sh)"
          export PATH="$(dirname "$chezmoi_bin"):$PATH"
          python3 -m pip install --require-hashes --only-binary=:all: -r modules/claude-work-tools/scripts/requirements.txt
          python3 scripts/test-modules.py

  windows:
    name: Windows read-only checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify PowerShell without changing the runner
        run: python -m unittest discover -s modules/windows-preferences/tests -p test_windows.py -v
