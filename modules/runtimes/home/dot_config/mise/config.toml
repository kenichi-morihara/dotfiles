# Language versions are managed here; Homebrew owns CLI/application dependencies.
[tools]
node = "25.2.1"
python = "3.14.2"
go = "1.27.2"
deno = "2.9.7"
lua = "5.5.1"
# Built by `mise install` (ruby-build); older PCs may import it with `mise link`.
ruby = "2.7.2"
# This Corepack release supports Node 25; packageManager selects pnpm/Yarn per project.
"npm:corepack" = "0.34.7"

[settings]
# Honor per-project .ruby-version so editors (ruby-lsp) and shells pick the project's Ruby.
idiomatic_version_file_enable_tools = ["ruby"]
